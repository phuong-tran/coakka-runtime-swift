name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Check public docs language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          failed = False
          files = [Path("README.md"), *sorted(Path("docs").glob("*.md"))]
          blocked = (
              "/Users/",
              "npm_",
              "pypi-",
              "internal/release",
              "protobuf schema",
              "native bridge internals",
              "CAF",
              "libuv",
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(ord(ch) > 127 for ch in line):
                      print(f"{path}:{line_no}: non-ASCII public doc text")
                      failed = True
                  if any(term in line for term in blocked):
                      print(f"{path}:{line_no}: blocked public doc wording")
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY
      - name: Verify native payload
        run: bash scripts/verify-native-payload.sh
      - name: Test package
        run: swift test
      - name: Run smoke
        run: swift run CoAkkaRuntimeSmoke
